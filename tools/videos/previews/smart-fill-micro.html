<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<base href="../output/smart-fill-micro-pilot-v1/">
<title>SATIFY · Smart Fill / five-second pilot</title>
<style>
  * {box-sizing:border-box} body {margin:0;background:#08131d;color:#f5f8fc;font:17px/1.5 system-ui,sans-serif}
  main {max-width:1328px;margin:48px auto;padding:0 24px} header {display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:18px}
  h1 {font-size:clamp(22px,3vw,32px);margin:0} .tag {color:#a7d7a9} video {display:block;width:100%;aspect-ratio:16/9;background:#0c1925;border-radius:12px}
  .actions {display:flex;gap:12px;flex-wrap:wrap;margin-top:20px} button,a {font:inherit;border:1px solid #486555;border-radius:8px;padding:10px 18px;background:#13271d;color:#e7f5ea;cursor:pointer;text-decoration:none}
  button:hover,a:hover {background:#234632} button:focus-visible,a:focus-visible {outline:3px solid #a7d7a9;outline-offset:3px}
  p {color:#b6c4cf} #status {min-height:1.5em} @media(max-width:600px) {main{margin:24px auto;padding:0 12px}header{display:block}.tag{margin-top:4px}}
</style>
<main>
  <header><h1>Click once. Label matching forest patches.</h1><span class="tag">SMART FILL PILOT V1 · 5 SECONDS · 16:9</span></header>
  <video id="pilot" controls playsinline muted preload="metadata" poster="poster.jpg" aria-label="Five-second Smart Fill pilot: one Global fill labels matching forest regions.">
    <source src="satify-smart-fill-5s-v1.mp4" type="video/mp4">
    <a href="satify-smart-fill-5s-v1.mp4">Open the video</a>
  </video>
  <div class="actions"><button id="silent">Replay</button><a href="satify-smart-fill-5s-v1.mp4" download>Download MP4</a></div>
  <p id="status" role="status">Silent video.</p>
  <p>Original SATIFY Global-mode footage, cropped to focus on the action. Edited for five-second playback.</p>
</main>
<script>
  const video = document.getElementById('pilot');
  const status = document.getElementById('status');
  async function replay() {
    video.muted = true;
    video.currentTime = 0;
    try { await video.play(); status.textContent = 'Playing.'; }
    catch { status.textContent = 'Use the video play control to start playback.'; }
  }
  document.getElementById('silent').addEventListener('click', replay);
</script>
</html>
